name: Release Loom

# Loom is EXPERIMENTAL: GitHub-release-only (no crates.io publish) while the
# `loom-0.x` series lasts — see experiment-loom/README.md and plan.md §6.

on:
  push:
    tags:
      - 'loom-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., loom-0.1.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve tag and version
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          if [[ "$TAG" != loom-* ]]; then
            echo "ERROR: tag '$TAG' is not a Loom release (must start with loom-)"
            exit 1
          fi

          VERSION="${TAG#loom-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Loom $VERSION from tag $TAG"

  build-loom:
    name: Build Loom (${{ matrix.target }})
    needs: [resolve-version]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: experiment-loom/web/package-lock.json

      - name: Verify Cargo.toml version matches tag
        shell: bash
        run: |
          CARGO_VERSION=$(grep '^version' experiment-loom/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${{ needs.resolve-version.outputs.version }}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: experiment-loom/Cargo.toml version ($CARGO_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi

      - name: Build frontend (embedded via rust-embed)
        shell: bash
        working-directory: experiment-loom/web
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Build release binary
        run: cargo build --release --manifest-path experiment-loom/Cargo.toml --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          BINARY=target/${{ matrix.target }}/release/straymark-loom
          ARCHIVE=straymark-loom-v${{ needs.resolve-version.outputs.version }}-${{ matrix.target }}.tar.gz
          tar czf "$ARCHIVE" -C "$(dirname "$BINARY")" "$(basename "$BINARY")"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          BINARY=target/${{ matrix.target }}/release/straymark-loom.exe
          ARCHIVE=straymark-loom-v${{ needs.resolve-version.outputs.version }}-${{ matrix.target }}.zip
          cp "$BINARY" straymark-loom.exe
          7z a "$ARCHIVE" straymark-loom.exe
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: loom-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  upload-to-release:
    name: Upload binaries to release
    needs: [resolve-version, build-loom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find release-artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release/ \;
          ls -la release/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ needs.resolve-version.outputs.tag }}"
          VERSION="${{ needs.resolve-version.outputs.version }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists, uploading binaries..."
            gh release upload "$TAG" release/* --clobber
          else
            echo "Creating release $TAG..."
            # NOT --latest: Loom is experimental; the CLI release stays the
            # repo's "latest" so update flows are unaffected.
            gh release create "$TAG" \
              --title "StrayMark Loom $VERSION (EXPERIMENTAL)" \
              --generate-notes \
              --latest=false \
              release/*
          fi

      - name: Prune Loom releases beyond the retention window
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Keep the newest KEEP releases; prune the rest. Retention exists so
          # adopters can roll back and so a migration can be verified against
          # the release it actually shipped in — neither is possible when only
          # the latest release survives.
          KEEP=5
          CURRENT_TAG="${{ needs.resolve-version.outputs.tag }}"
          # The current tag is in this list, so it counts toward KEEP naturally.
          # `sort -rV` orders newest-first; `tail -n +$((KEEP+1))` is everything
          # past the window.
          mapfile -t doomed < <(
            gh release list --limit 200 --json tagName --jq '.[].tagName' \
              | grep '^loom-' \
              | sort -rV \
              | tail -n +$((KEEP + 1))
          )
          if [ ${#doomed[@]} -eq 0 ]; then
            echo "Nothing to prune: loom-* releases are within the retention window of $KEEP."
            exit 0
          fi
          for tag in "${doomed[@]}"; do
            if [ "$tag" = "$CURRENT_TAG" ]; then
              echo "Refusing to prune the release just published ($tag)." >&2
              exit 1
            fi
            # No --cleanup-tag: the tag is the historical record and costs
            # nothing to keep. Only the release (and its assets) is pruned, so
            # `git checkout <tag>` keeps working for every version ever shipped.
            echo "Pruning release $tag (outside the newest $KEEP); tag kept..."
            gh release delete "$tag" --yes
          done
