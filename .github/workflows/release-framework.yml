name: Release Framework

on:
  push:
    tags:
      - 'fw-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., fw-4.2.0)'
        required: true

permissions:
  contents: write

jobs:
  package-framework:
    name: Package Framework
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Resolve tag and version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#fw-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaging Framework $VERSION from tag $TAG"

      - name: Verify dist-manifest.yml version matches tag
        run: |
          MANIFEST_VERSION=$(grep '^version:' dist/dist-manifest.yml | sed 's/version: *"\(.*\)"/\1/')
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: dist-manifest.yml version ($MANIFEST_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi

      - name: Create distribution ZIP
        run: |
          mkdir -p dist-staging
          cp -a dist/. dist-staging/
          cd dist-staging
          zip -r "../straymark-fw-${{ steps.version.outputs.version }}.zip" .
          cd ..

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="straymark-fw-${VERSION}.zip"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists, uploading asset..."
            gh release upload "$TAG" "$ASSET" --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --title "StrayMark Framework $VERSION" \
              --generate-notes \
              "$ASSET"
          fi

      - name: Prune framework releases beyond the retention window
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep the newest KEEP releases; prune the rest. Retention exists so
          # adopters can roll back and so a migration can be verified against
          # the release it actually shipped in — neither is possible when only
          # the latest release survives.
          KEEP=5
          CURRENT_TAG="${{ steps.version.outputs.tag }}"
          # The current tag is in this list, so it counts toward KEEP naturally.
          # `sort -rV` orders newest-first; `tail -n +$((KEEP+1))` is everything
          # past the window.
          mapfile -t doomed < <(
            gh release list --limit 200 --json tagName --jq '.[].tagName' \
              | grep '^fw-' \
              | sort -rV \
              | tail -n +$((KEEP + 1))
          )
          if [ ${#doomed[@]} -eq 0 ]; then
            echo "Nothing to prune: fw-* releases are within the retention window of $KEEP."
            exit 0
          fi
          for tag in "${doomed[@]}"; do
            if [ "$tag" = "$CURRENT_TAG" ]; then
              echo "Refusing to prune the release just published ($tag)." >&2
              exit 1
            fi
            # No --cleanup-tag: the tag is the historical record and costs
            # nothing to keep. Only the release (and its assets) is pruned, so
            # `git checkout <tag>` keeps working for every version ever shipped.
            echo "Pruning release $tag (outside the newest $KEEP); tag kept..."
            gh release delete "$tag" --yes
          done
