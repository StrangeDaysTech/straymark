# Piloto work_verb — declaración del autor (E2 / propuesta tercera vía)
#
# Lo que el autor (humano+agente) declararía AL CREAR la unidad, sin inferir del título.
#   work_verb: design | implement | audit | operate
#   design_provenance: new | upstream   (¿la decisión difícil ya se gastó aguas arriba?)
#
# Mapa verb→tier (propuesta): design→planner · implement→implementer · audit→auditor
#   · operate→operator.  Regla de carga residual: implement|design + provenance=upstream
#   ⇒ se DEGRADA a operator (instrumenta diseño previo, trabajo mecánico).
#
# Nota de vocabulario (hallazgo del piloto): "definir contrato/interface fundacional"
#   es implement (implementer), NO design (planner). 'design' se reserva a arquitectura
#   abierta. En esta muestra hay 0 design → consistente con E1 (planner=0 real).

