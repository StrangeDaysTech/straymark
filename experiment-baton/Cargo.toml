[package]
name = "straymark-baton"
version = "0.1.0"
edition = "2021"
description = "Baton — StrayMark's experimental Coherence Bridge: reconciles SpecKit intent against governance and code (read-only, no model orchestration in Phase 1)"
license = "MIT"
repository = "https://github.com/StrangeDaysTech/straymark"
authors = ["Strange Days Tech, S.A.S."]
# Experimental: GitHub-release-only (no crates.io publish), mirroring Loom.
publish = false

[lib]
name = "straymark_baton"
path = "src/lib.rs"

[[bin]]
name = "straymark-baton"
path = "src/main.rs"

[dependencies]
straymark-core = { version = "0.9.0", path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
