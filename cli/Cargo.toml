[package]
name = "straymark-cli"
version = "3.28.2"
edition = "2021"
description = "CLI for StrayMark — the cognitive discipline your AI-assisted projects need"
license = "MIT"
repository = "https://github.com/StrangeDaysTech/straymark"
homepage = "https://strangedays.tech"
readme = "README.md"
keywords = ["straymark", "documentation", "governance", "ai", "cli"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Strange Days Tech, S.A.S."]
include = ["src/**/*", "Cargo.toml", "README.md"]

[[bin]]
name = "straymark"
path = "src/main.rs"

# Internal build tool (regenerates dist/.codex/skills from dist/.claude/skills).
# Gated behind the non-default `dev-tools` feature so `cargo install straymark-cli`
# does NOT install it — only the `straymark` binary ships to users.
[[bin]]
name = "gen_codex_skills"
path = "src/bin/gen_codex_skills.rs"
required-features = ["dev-tools"]

[dependencies]
straymark-core = { version = "0.8.0", path = "../core" }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
zip = "2"
tempfile = "3"
colored = "2"
indicatif = "0.17"
dialoguer = "0.11"
sha2 = "0.10"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
semver = "1"
flate2 = "1"
tar = "0.4"
unicode-width = "0.2"
jsonschema = { version = "0.18", default-features = false }
ratatui = { version = "0.29", optional = true, default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", optional = true }
pulldown-cmark = { version = "0.12", optional = true }
arborist-metrics = { version = "0.1", optional = true, features = ["all"] }
regex = { version = "1", optional = true }
glob = { version = "0.3", optional = true }

[features]
default = ["tui", "analyze"]
tui = ["ratatui", "crossterm", "pulldown-cmark"]
analyze = ["arborist-metrics", "regex", "glob"]
# Enables the internal `gen_codex_skills` build tool (dev/CI only, not installed).
dev-tools = []

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# [profile.release] moved to the workspace root Cargo.toml (Loom M0) —
# cargo only honors profiles declared at the workspace root.
