<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loom — StrayMark knowledge graph</title>
    <style>
      :root { --bg:#14161c; --panel:#1c1f27; --text:#d6d9e0; --muted:#8b91a0; --accent:#e8833a; --border:#2a2e3a; }
      * { box-sizing:border-box; margin:0; }
      html, body { height:100%; }
      body { background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
      button, input, select { font:inherit; }
      button { cursor:pointer; }
      #graph { position:absolute; inset:0; z-index:0; }
      #graph canvas { z-index:0 !important; }
      header { position:absolute; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; gap:12px; padding:10px 16px; background:linear-gradient(to bottom,rgba(20,22,28,.98),rgba(20,22,28,.72)); }
      header h1 { font-size:16px; font-weight:650; letter-spacing:.02em; white-space:nowrap; }
      header h1 span.brand { color:var(--accent); }
      .badge { font-size:10px; font-weight:700; letter-spacing:.08em; color:#14161c; background:var(--accent); padding:2px 7px; border-radius:999px; text-transform:uppercase; }
      #counts, #status, .muted { color:var(--muted); font-size:12px; }
      #status { white-space:nowrap; }
      #status.live::before, #status.down::before { content:"●"; margin-right:5px; }
      #status.live::before { color:#4caf78; } #status.down::before { color:#c75050; }
      .search-wrap { position:relative; }
      #search { width:150px; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:5px; padding:4px 8px; font-size:11px; }
      #search-results { position:absolute; top:100%; left:0; margin-top:4px; width:260px; max-height:260px; overflow:auto; background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:4px; display:none; z-index:120; }
      #search-results.open { display:block; }
      #search-results button { display:block; width:100%; text-align:left; color:var(--text); background:none; border:0; border-radius:5px; padding:4px 7px; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      #search-results button:hover { background:#242731; }
      #search-results .empty { color:var(--muted); font-size:11px; padding:4px 7px; }
      .sizing { display:flex; align-items:center; gap:5px; color:var(--muted); font-size:11px; }
      #sizing { color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:5px; padding:4px 6px; font-size:11px; }
      .view { display:flex; align-items:center; gap:4px; color:var(--muted); font-size:11px; white-space:nowrap; cursor:pointer; }
      .view input { accent-color:var(--accent); cursor:pointer; }
      #filters { display:flex; gap:5px; }
      #filters input { width:78px; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:5px; padding:4px 6px; font-size:11px; }
      #filters input[type="date"] { width:112px; }
      #filters button { color:var(--text); background:#292d38; border:1px solid #3a3f4d; border-radius:5px; padding:4px 8px; font-size:11px; }
      #pinbar { display:none; align-items:center; gap:7px; color:var(--accent); background:#242731; border:1px solid var(--accent); border-radius:999px; padding:2px 5px 2px 10px; font-size:11px; }
      #pinbar.open { display:flex; }
      #pinbar button { color:var(--text); background:#181b22; border:1px solid var(--border); border-radius:999px; padding:2px 8px; font-size:10px; }
      .right { margin-left:auto; display:flex; align-items:center; gap:12px; }
      aside { position:absolute; z-index:100; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px 16px; overflow:auto; }
      aside h2 { font-size:14px; margin:4px 0 8px; }
      aside h3 { color:var(--muted); font-size:11px; margin:12px 0 5px; text-transform:uppercase; letter-spacing:.05em; }
      #stats { left:14px; top:62px; width:260px; max-height:calc(100% - 242px); }
      #stats, #legend, #selection, #stats button, #legend button, #selection button, #selection a, summary { pointer-events:auto; }
      #stats .stat-total { margin-bottom:10px; }
      #stats .stat-total b { color:var(--accent); }
      .chips { display:flex; flex-wrap:wrap; gap:4px; }
      .chips span { color:var(--muted); border:1px solid var(--border); border-radius:999px; padding:2px 6px; font-size:10px; }
      .chips b { color:var(--text); }
      details { border-top:1px solid var(--border); margin-top:12px; padding-top:8px; }
      summary { color:var(--muted); cursor:pointer; font-size:11px; }
      summary.cycles { color:var(--accent); }
      ul { list-style:none; padding:5px 0 0; font-size:11px; }
      li { margin:3px 0; overflow-wrap:anywhere; }
      .cycle { color:var(--accent); }
      .node-link { color:#8eb8ed; background:none; border:0; padding:0; text-align:left; font-size:inherit; }
      .node-link:hover { text-decoration:underline; }
      .dangling { color:#d98282; }
      #selection { right:14px; top:62px; width:320px; max-height:calc(100% - 84px); display:none; }
      #selection.open { display:block; }
      #selection .close { position:absolute; top:7px; right:10px; color:var(--muted); background:none; border:0; font-size:20px; }
      #selection .doc-type { font-size:11px; font-weight:700; letter-spacing:.06em; }
      #selection .meta { color:var(--muted); font-size:12px; margin-bottom:8px; }
      #selection .path { display:inline-block; margin-top:4px; overflow-wrap:anywhere; }
      #selection .links { display:flex; flex-wrap:wrap; gap:4px 8px; font-size:11px; }
      #selection .excerpt { color:var(--text); font-size:12px; white-space:pre-wrap; }
      #selection .excerpt-note { color:var(--accent); border-top:1px solid var(--border); margin-top:10px; padding-top:8px; font-size:11px; }
      #selection .actions { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 2px; }
      #selection .actions a, #selection .actions button { color:var(--text); background:#292d38; border:1px solid #3a3f4d; border-radius:5px; padding:4px 9px; font-size:11px; text-decoration:none; }
      #selection .actions a:hover, #selection .actions button:hover { border-color:var(--accent); }
      #selection .actions .pin { color:var(--accent); }
      #legend { position:absolute; left:14px; bottom:14px; z-index:100; width:360px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:9px 10px; font-size:11px; color:var(--muted); }
      #legend .legend-summary { margin-bottom:7px; }
      #legend .legend-summary b { color:var(--text); }
      #legend .community-list { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
      #legend .community { display:flex; align-items:center; min-width:0; gap:5px; color:var(--muted); background:#181b22; border:1px solid var(--border); border-radius:5px; padding:4px 6px; text-align:left; }
      #legend .community:hover, #legend .community.active { color:var(--text); border-color:var(--accent); background:#242731; }
      #legend .community span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      #legend .community b { color:var(--text); margin-left:auto; }
      #legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
      #zoom-controls { position:absolute; right:14px; bottom:14px; z-index:110; display:flex; flex-direction:column; gap:6px; }
      #zoom-controls button { width:34px; height:34px; display:flex; align-items:center; justify-content:center; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:8px; cursor:pointer; pointer-events:auto; }
      #zoom-controls button:hover { color:var(--accent); border-color:var(--accent); background:#242731; }
      #zoom-controls svg { width:16px; height:16px; }
      @media (max-width:1240px) { #filters input { width:60px; } #filters input[type="date"] { display:none; } #search { width:110px; } }
    </style>
  </head>
  <body>
    <div id="graph"></div>
    <header>
      <h1><span class="brand">Loom</span> · <span id="subtitle">knowledge graph</span></h1>
      <span class="badge" id="badge">experimental</span>
      <span id="counts"></span>
      <div class="search-wrap">
        <input id="search" autocomplete="off" aria-label="Search" />
        <div id="search-results"></div>
      </div>
      <label class="sizing"><span id="sizing-label">Size</span>
        <select id="sizing">
          <option value="betweenness">Betweenness</option>
          <option value="pagerank">PageRank</option>
          <option value="degree">Degree</option>
        </select>
      </label>
      <label class="view"><input type="checkbox" id="labels-toggle" checked /><span id="labels-label">Labels</span></label>
      <label class="view"><input type="checkbox" id="isolated-toggle" /><span id="isolated-label">Hide isolated</span></label>
      <form id="filters">
        <input name="type" aria-label="Filter by type" />
        <input name="status" aria-label="Filter by status" />
        <input name="risk" aria-label="Filter by risk" />
        <input name="tag" aria-label="Filter by tag" />
        <input name="from" type="date" aria-label="Created from" />
        <input name="to" type="date" aria-label="Created to" />
        <button type="submit" id="filter-submit">Filter</button>
        <button type="reset" id="filter-clear">Clear</button>
      </form>
      <div class="right">
        <span id="pinbar"><span id="pin-label"></span><button type="button" id="pin-clear">Unpin</button></span>
        <span id="status">connecting…</span>
      </div>
    </header>
    <aside id="stats"></aside>
    <footer id="legend"></footer>
    <aside id="selection"></aside>
    <div id="zoom-controls">
      <button type="button" id="zoom-in"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <button type="button" id="zoom-out"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <button type="button" id="zoom-reset"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6V3h3M13 6V3h-3M3 10v3h3M13 10v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
