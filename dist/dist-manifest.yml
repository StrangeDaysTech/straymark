version: "4.44.0"
description: "StrayMark distribution manifest"
repository: "https://github.com/StrangeDaysTech/straymark"

# Files included when running `straymark init`
files:
  # Core framework
  - .straymark/

  # Unified rules file
  - STRAYMARK.md

  # Agent skills
  - .claude/skills/
  - .codex/skills/
  - .qoder/skills/
  - .qwen/skills/
  - .agent/skills/

  # CI/CD
  - .github/workflows/docs-validation.yml

# Files that are injected into existing directive files
# (not copied, but merged via markers)
injections:
  - target: AGENTS.md
    template: dist-templates/directives/AGENTS.md
  - target: CLAUDE.md
    template: dist-templates/directives/CLAUDE.md
  - target: GEMINI.md
    template: dist-templates/directives/GEMINI.md
  - target: QWEN.md
    template: dist-templates/directives/QWEN.md
  - target: .github/copilot-instructions.md
    template: dist-templates/directives/copilot-instructions.md
  - target: .cursorrules
    template: dist-templates/directives/cursorrules
    embed: STRAYMARK.md
  - target: .cursor/rules/straymark.md
    template: dist-templates/directives/cursor-rules-straymark.md
    embed: STRAYMARK.md

# Paths this release no longer distributes. `update-framework` and `repair`
# delete them from an existing installation when the file on disk still matches
# the hash StrayMark recorded — i.e. we put it there and nobody edited it since.
# Operator-modified and operator-authored files are kept and named in the
# report. `init` ignores this key: a fresh tree has nothing to retire.
retired:
  # Gemini CLI was retired by Google; its successor, Antigravity CLI (`agy`),
  # does not treat `<project>/.gemini/skills/` as a discovery location.
  - .gemini/skills/
  # `.agent/` is a valid Antigravity customization root, but the subdirectory
  # it reads is `skills/<name>/SKILL.md` — never `workflows/<name>.md`.
  - .agent/workflows/
